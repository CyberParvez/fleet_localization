ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true
    publish_acceleration: false
    transform_time_offset: 0.0
    transform_timeout: 0.1
    odom0: wheel/odometry
    odom0_config: [false, false, false, false, false, false, true, false, false, false, false, true, false, false, false]
    odom0_differential: false
    imu0: imu
    imu0_config: [false, false, false, false, false, true, false, false, false, false, false, true, false, false, false]
    imu0_differential: false
    imu0_remove_gravitational_acceleration: false
health:
  freshness_seconds: 1.0
  future_tolerance_seconds: 0.1
  tf_future_tolerance_seconds: 1.0
  ordering_tolerance_seconds: 0.001
  degrade_after_seconds: 2.0
  recover_after_seconds: 2.0
  position_covariance_max: 0.25
  yaw_covariance_max: 0.10
amcl:
  ros__parameters:
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_footprint
    do_beamskip: false
    global_frame_id: map
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: likelihood_field
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: odom
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: nav2_amcl::DifferentialMotionModel
    save_pose_rate: 0.5
    scan_topic: scan
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
